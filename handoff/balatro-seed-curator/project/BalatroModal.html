<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balatro Modal — iPhone SE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'm6x11plus', monospace;
      background: #1e2b2d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .viewport {
      width: 320px;
      height: 568px;
      background: #1e2b2d;
      border: 1px solid #333;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 280px;
      background: #3a5055;
      border: 4px solid #b9c2d2;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 0 #777e89,
                  0 6px 0 rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #fe5148;
      z-index: 10;
    }

    .modal-content {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      scrollbar-width: none;
    }

    .modal-content::-webkit-scrollbar {
      display: none;
    }

    .modal-title {
      text-align: center;
      font-size: 16px;
      color: #e4b643;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      padding: 0;
      cursor: pointer;
      background: transparent;
      position: relative;
    }

    .btn-face {
      padding: 10px 16px;
      border-radius: 6px;
      text-align: center;
      font-family: 'm6x11plus', monospace;
      font-size: 14px;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8);
      transition: transform 55ms linear, box-shadow 55ms linear;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.8);
      transform: translateY(0);
    }

    .btn--red .btn-face {
      background: #fe5148;
    }

    .btn--red:active .btn-face,
    .btn--red:hover .btn-face {
      background: #a02721;
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn--orange .btn-face {
      background: #ff9800;
    }

    .btn--orange:active .btn-face,
    .btn--orange:hover .btn-face {
      background: #a05b00;
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn--purple .btn-face {
      background: #9e74ce;
    }

    .btn--purple:active .btn-face,
    .btn--purple:hover .btn-face {
      background: #5e437e;
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn--cyan .btn-face {
      background: #00a7ca;
    }

    .btn--cyan:active .btn-face,
    .btn--cyan:hover .btn-face {
      background: #00657c;
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn--blue .btn-face {
      background: #2e76fd;
    }

    .btn--blue:active .btn-face,
    .btn--blue:hover .btn-face {
      background: #14449e;
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-full {
      width: 100%;
    }

    .modal-footer {
      padding: 12px 16px;
      flex-shrink: 0;
      border-top: 3px solid #000;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-1col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-label {
      display: block;
    }

    .btn-sub {
      display: block;
      font-size: 10px;
      color: #b9c2d2;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-content">
          <div class="modal-title">Collection</div>
          <div class="grid-2col">
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Jokers</span>
                <span class="btn-sub">150 / 150</span>
              </div>
            </button>
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Enhanced Cards</span>
              </div>
            </button>
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Decks</span>
                <span class="btn-sub">15 / 15</span>
              </div>
            </button>
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Seals</span>
              </div>
            </button>
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Vouchers</span>
                <span class="btn-sub">32 / 32</span>
              </div>
            </button>
            <button class="btn btn--red btn-full">
              <div class="btn-face">
                <span class="btn-label">Editions</span>
                <span class="btn-sub">5 / 5</span>
              </div>
            </button>
          </div>
          <div style="margin-top: 4px;">
            <button class="btn btn--purple btn-full">
              <div class="btn-face">
                <span class="btn-label">Tarot Cards</span>
                <span class="btn-sub">22 / 22</span>
              </div>
            </button>
          </div>
          <div>
            <button class="btn btn--cyan btn-full">
              <div class="btn-face">
                <span class="btn-label">Planet Cards</span>
                <span class="btn-sub">12 / 12</span>
              </div>
            </button>
          </div>
          <div>
            <button class="btn btn--blue btn-full">
              <div class="btn-face">
                <span class="btn-label">Spectral Cards</span>
                <span class="btn-sub">18 / 18</span>
              </div>
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn--orange btn-full">
            <div class="btn-face">Back</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
