name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · vocab · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # jaml-lang (name lists) and motely-wasm (runtime enums) are versioned
      # independently — this fails the build when they describe different
      # engine builds, instead of letting an ordinal decode to a wrong name.
      - name: Vocabulary drift
        run: pnpm vocab:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
